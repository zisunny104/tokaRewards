fun:
  facts:
    - "章魚有三顆心臟。"
    - "蜂蜜幾乎不會腐壞。"
    - "金星的一天比它的一年還要長。"
    - "香蕉在植物學上屬於漿果。"
    - "鯨魚不是魚，是哺乳動物。"
    - "光從太陽到地球大約要 8 分多鐘。"
    - "地球表面大約七成被海水覆蓋。"
    - "北極熊的皮膚是黑色的。"
    - "長頸鹿和人類一樣都是七節頸椎。"
    - "海馬是由爸爸負責懷孕生產。"
    - "蝴蝶用腳來嚐味道。"
    - "成年人的骨頭大約有 206 塊。"
    - "月球每年都會遠離地球幾公分。"
    - "木星是太陽系最大的行星。"
    - "水在攝氏 4 度左右密度最大。"
    - "聲音在水中傳得比在空氣中快。"
    - "玉山海拔約 3,952 公尺，是台灣最高峰。"
    - "圓周率是無限不循環小數。"
    - "珊瑚是動物，不是植物。"
    - "竹子是草本植物，屬於禾本科。"
    - "草莓表面的小顆粒才是真正的果實。"
    - "蜂鳥是少數能向後飛的鳥。"
    - "烏鴉能記得人的長相。"
    - "海星沒有大腦。"
    - "水母沒有心臟，也沒有大腦。"
    - "袋熊的便便是方塊形的。"
    - "考拉的指紋和人類很像。"
    - "螢火蟲發光是用來彼此溝通。"
    - "企鵝不會飛，但很會游泳。"
    - "蜜蜂會替作物授粉。"
    - "Minecraft 最早由 Markus Persson 開發。"
    - "Minecraft 1.0 在 2011 年 11 月正式發布。"
    - "苦力怕的誕生，起因於一個做壞的豬模型。"
    - "終界龍是遊戲裡的第一隻 Boss。"
    - "地獄走 1 格，相當於主世界走 8 格。"
    - "多數方塊一組最多可以堆 64 個。"
    - "貓可以嚇跑苦力怕。"
    - "鑽石礦多半藏在很深的地底。"
    - "雞蛋丟出去有機會孵出小雞。"
    - "村民的職業由他身邊的職業方塊決定。"
    - "熔岩遇到水會變成黑曜石或鵝卵石。"
    - "遊戲裡的一天大約是現實的 20 分鐘。"
    - "洞穴蜘蛛的攻擊會讓人中毒。"
    - "與末影人對視會激怒它。"
    - "骷髏被苦力怕炸死時會掉出音樂唱片。"
    - "基岩在生存模式下無法被破壞。"
    - "睡在床上可以跳過夜晚。"
    - "被閃電擊中的苦力怕會變成閃電苦力怕。"
    - "被閃電擊中的豬會變成殭屍豬布林。"
    - "一桶熔岩可以當燃料，燒煉很多物品。"
